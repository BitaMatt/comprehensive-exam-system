name: comprehensive_exam_system
description: "跨 Windows 和 Android 的综合考试练习系统。"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.7
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  syncfusion_flutter_pdf: ^31.2.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/question_banks/bank1.json
    - assets/question_banks/bank2.json
    - assets/question_banks/bank3.json
    - assets/question_banks/bank4.json
    - assets/question_banks/bank5.json
    - assets/question_banks/bank6.json
    - assets/question_banks/bank7.json
